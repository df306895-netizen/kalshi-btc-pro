<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalshi BTC PRO</title>

<style>

body{

background:#111;

color:white;

font-family:Arial;

text-align:center;

padding:30px;

}

.card{

max-width:600px;

margin:auto;

background:#1d1d1d;

padding:30px;

border-radius:20px;

box-shadow:0 0 25px rgba(0,255,255,.2);

}

.price{

font-size:55px;

font-weight:bold;

}

.signal{

font-size:70px;

font-weight:bold;

margin-top:20px;

}

.up{

color:#00ff66;

}

.down{

color:#ff3b3b;

}

table{

width:100%;

margin-top:30px;

font-size:22px;

}

td{

padding:8px;

}

.reason{

text-align:left;

margin-top:20px;

font-size:18px;

}

.count{

font-size:35px;

margin-top:20px;

font-weight:bold;

}

</style>

</head>

<body>

<div class="card">

<h1>🚀 KALSHI BTC PRO</h1>

<div class="price" id="price">$0</div>

<div id="signal" class="signal">...</div>

<h2 id="confidence">0%</h2>

<table>

<tr>

<td>EMA 9</td>

<td id="ema9"></td>

</tr>

<tr>

<td>EMA 21</td>

<td id="ema21"></td>

</tr>

<tr>

<td>RSI</td>

<td id="rsi"></td>

</tr>

<tr>

<td>MACD</td>

<td id="macd"></td>

</tr>

</table>

<div class="reason" id="reasons"></div>

<div class="count" id="countdown"></div>

</div>

<script>

async function load(){

const r=await fetch("/api/signal");

const d=await r.json();

document.getElementById("price").innerHTML="$"+d.price;

document.getElementById("confidence").innerHTML=d.confidence+"%";

document.getElementById("ema9").innerHTML=d.ema9;

document.getElementById("ema21").innerHTML=d.ema21;

document.getElementById("rsi").innerHTML=d.rsi;

document.getElementById("macd").innerHTML=d.macd;

document.getElementById("countdown").innerHTML="⏳ "+d.countdown;

let s=document.getElementById("signal");

s.innerHTML=d.prediction;

if(d.prediction=="UP"){

    s.className="signal up";

}
else if(d.prediction=="DOWN"){

    s.className="signal down";

}
else{

    s.style.color="#FFD700";

}

let txt="";

for(let x of d.reasons){

txt+="✔ "+x+"<br>";

}

document.getElementById("reasons").innerHTML=txt;

}

load();

setInterval(load,5000);

</script>

</body>

</html>
